name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify that the tag points to a commit on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/master"; then
            echo "Release tags must point to a commit that is already on master."
            exit 1
          fi

      - name: Verify that the tag version matches pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version ($tag_version) does not match pyproject.toml ($project_version)."
            exit 1
          fi

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build source distribution and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torchwires
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
